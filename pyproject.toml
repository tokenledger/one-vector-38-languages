[project]
name = "xsyc"
version = "0.1.0"
description = "One anti-sycophancy vector, 38 languages"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "accelerate>=0.33",
    "huggingface_hub>=0.24",
    "pandas>=2.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
plot = ["matplotlib>=3.8", "numpy>=1.26"]
modal = ["modal>=0.73"]
ndif = ["nnsight>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
